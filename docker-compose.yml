# Nisbat Home on a home server / NAS.
#   cp .env.example .env   # then set CAST_DEVICE, NISBAT_URL, CAST_HOST
#   docker compose up -d --build
name: nisbat

services:
  nisbat:
    build: .
    image: nisbat-home:latest
    restart: unless-stopped
    ports:
      - "${NISBAT_PORT:-3080}:3000"
    environment:
      - PAKDATAHUB_API_KEY=${PAKDATAHUB_API_KEY:-}
      - TZ=${TZ:-Asia/Karachi}
    volumes:
      - ./data:/data

  autocast:
    build:
      context: .
      dockerfile: docker/autocast.Dockerfile
    image: nisbat-autocast:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - nisbat
    environment:
      - CAST_DEVICE=${CAST_DEVICE:?set CAST_DEVICE in .env}
      - CAST_HOST=${CAST_HOST:-}
      - NISBAT_URL=${NISBAT_URL:?set NISBAT_URL in .env}
      - CAST_INTERVAL=${CAST_INTERVAL:-60}
      - CAST_QUIET=${CAST_QUIET:-}
      - TZ=${TZ:-Asia/Karachi}

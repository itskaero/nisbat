<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nisbat Home</title>
    <meta name="theme-color" content="#0b1220" />
    <style>
      /* Painted before any JS loads: the Chromecast shows this instantly. */
      html, body { margin: 0; height: 100%; background: #0b1220; color: #f5f7fa; overflow: hidden; }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 80% at 50% 0%, #17304a 0%, #0b1220 60%); font-family: system-ui, sans-serif; transition: opacity 400ms ease; z-index: 200; }
      #splash .mark { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(140deg, #45d49a, #65c7e8); box-shadow: 0 20px 60px -20px rgba(69,212,154,.6);
        animation: breathe 1600ms ease-in-out infinite alternate; }
      #splash .name { font-size: 34px; letter-spacing: .02em; font-weight: 600; }
      #splash .sub { font-size: 18px; color: #a9b5c5; }
      #splash.done { opacity: 0; pointer-events: none; }
      @keyframes breathe { from { transform: scale(.94); opacity: .85 } to { transform: scale(1); opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark"></div>
      <div class="name">Nisbat Home</div>
      <div class="sub">نسبت · Loading</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
